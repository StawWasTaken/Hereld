<style>
/* The splash covers the boot, so it has to be right before the stylesheets
   land, not after. These are the same rules as in hereld.css and they are here
   because the mark is drawn in the page's own background colour: without the
   fill showing through the mask there is nothing on the screen at all. */
.hd-splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #0C0F15; }
.hd-splash[hidden] { display: none; }
.hd-splash-mark {
  width: min(272px, 62vw); aspect-ratio: 1; display: block;
  background: var(--nb-blue, #2CAFFC);
  -webkit-mask: url('HereldAt.png') center / contain no-repeat;
  mask: url('HereldAt.png') center / contain no-repeat;
}
/* Put up in place of the mark when its artwork does not arrive. A mask with
   no image draws nothing, so without this the screen would simply be empty. */
.hd-splash-word {
  font: 700 34px/1 'Syne', system-ui, sans-serif;
  letter-spacing: .04em; color: var(--nb-blue, #2CAFFC);
}
</style>
</head>
<body class="hd-app">

<div class="hd-splash" id="splash">
  <span class="hd-splash-mark" role="img" aria-label="Hereld"></span>
</div>
<script>
/* Shown when somebody arrives at Hereld, not every time they open a page
   inside it. The flag is read before the first paint, so a return visit
   never flashes.

   The clock starts when the mark is on the screen, not when the page is.
   The mark is a mask, so until the artwork has decoded there is nothing
   there at all, and holding from page load meant a slow fetch bought a
   plain dark screen for the whole two and a half seconds. __hdSplashArt is
   the moment it can be seen; the boot holds from there.

   A mask whose image never arrives hides its element completely, which is
   how the Supernova mark used to fail. So a fetch that fails puts
   the name up in words instead, and says so, rather than holding an empty
   screen and then opening on nothing. */
(function () {
  var arrived = false;
  try {
    arrived = !!sessionStorage.getItem('hd-arrived');
    sessionStorage.setItem('hd-arrived', '1');
  } catch (e) {}

  var s = document.getElementById('splash');
  if (arrived) { if (s) s.hidden = true; return; }
  window.__hdSplashAt = Date.now();

  var art = new Image();
  art.onload = function () { window.__hdSplashArt = Date.now(); };
  art.onerror = function () {
    window.__hdSplashArt = -1;
    var m = s && s.querySelector('.hd-splash-mark');
    if (m) { m.className = 'hd-splash-word'; m.textContent = 'Hereld'; }
  };
  art.src = 'HereldAt.png';
})();
</script>
