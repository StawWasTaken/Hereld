<!DOCTYPE html>
<html lang="en" data-nb="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hereld</title>
<meta name="description" content="Hereld, the professional network by Swiftaw.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0F15">

<script>
(function () {
  var b = '/';
  if (/\.github\.io$/i.test(location.hostname)) {
    var s = location.pathname.split('/');
    if (s[1] && s[1].indexOf('.') < 0) b = '/' + s[1] + '/';
  }
  document.write('<base href="' + b + '">');
})();
</script>
<link rel="icon" type="image/png" href="Hereld%20favicon.png">
<link rel="apple-touch-icon" href="Hereld%20favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hereld-nb.css?v=3">
<link rel="stylesheet" href="css/hereld.css?v=3">
<link rel="preload" as="image" href="HereldAt.png" fetchpriority="high">
<style>
/* The splash covers the boot, so it has to be right before the stylesheets
   land, not after. These are the same rules as in hereld.css and they are here
   because the mark is drawn in the page's own background colour: without the
   fill showing through the mask there is nothing on the screen at all. */
.hd-splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #0C0F15; }
.hd-splash[hidden] { display: none; }
.hd-splash-mark {
  width: min(272px, 62vw); aspect-ratio: 1; display: block;
  background: var(--nb-blue, #2CAFFC);
  -webkit-mask: url('HereldAt.png') center / contain no-repeat;
  mask: url('HereldAt.png') center / contain no-repeat;
}
</style>
</head>
<body class="hd-app">

<div class="hd-splash" id="splash">
  <span class="hd-splash-mark" role="img" aria-label="Hereld"></span>
</div>
<script>
/* Shown when somebody arrives at Hereld, not every time they open a page
   inside it. The flag is read before the first paint, so a return visit
   never flashes. The time it went up is kept so the boot can hold it there
   long enough to be read rather than blinked. */
(function () {
  try {
    if (sessionStorage.getItem('hd-arrived')) {
      document.getElementById('splash').hidden = true;
    } else {
      window.__hdSplashAt = Date.now();
    }
    sessionStorage.setItem('hd-arrived', '1');
  } catch (e) { window.__hdSplashAt = Date.now(); }
})();
</script>

<noscript>
  <div class="hd-boot-bad">
    <h1>Hereld needs JavaScript</h1>
    <p>The feed, the composer and everything else here are drawn in the browser.
      Turn JavaScript on for this site and reload.</p>
  </div>
</noscript>

<script src="css/hereld-account.js?v=3"></script>
<script src="css/hereld-ui.js?v=3"></script>
<script src="css/hereld-app.js?v=3" defer></script>
</body>
</html>
